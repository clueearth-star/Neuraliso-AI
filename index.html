  <body class="bg-[#0B1121] text-[#f8fafc] antialiased selection:bg-[#00d4ff]/30">
    <noscript>
      <div style="padding: 40px; text-align: center; background: #0B1121; color: white; min-height: 100vh;">
        <h2>JavaScript is required</h2>
        <p>Please enable JavaScript to use Neuraliso.</p>
      </div>
    </noscript>
    <div id="root">
      <div id="splash" style="
        position: fixed;
        inset: 0;
        background: #0B1121;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease;
      ">
        <div style="width: 80px; height: 80px; margin-bottom: 24px;">
          <!-- Simple inline SVG brain logo -->
          <svg viewBox="0 0 100 100" fill="none" stroke="#00d4ff" stroke-width="2">
            <path d="M50 20 C65 20, 75 30, 78 45 C80 55, 78 65, 72 72 C68 76, 62 78, 58 80 L58 92 C58 96, 54 98, 50 98 C46 98, 42 96, 42 92 L42 80 C38 78, 32 76, 28 72 C22 65, 20 55, 22 45 C25 30, 35 20, 50 20Z"/>
            <circle cx="50" cy="55" r="8" fill="#00d4ff" opacity="0.3"/>
          </svg>
        </div>
        <p style="color: rgba(255,255,255,0.5); font-family: system-ui;">Neuraliso</p>
      </div>
    </div>
    <script>
      // Fail-safe: ensure splash overlay is removed even if React takes time or hits an edge case
      window.__removeSplash = function() {
        const splash = document.getElementById('splash');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => { if (splash && splash.parentNode) splash.parentNode.removeChild(splash); }, 400);
        }
      };
      // Auto dismiss splash after 2.5s maximum as backup
      setTimeout(window.__removeSplash, 2500);
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.onupdatefound = () => {
              const installingWorker = reg.installing;
              if (installingWorker) {
                installingWorker.onstatechange = () => {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[PWA] New version installed; activating immediately.');
                    installingWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                };
              }
            };
          }).catch((err) => {
            console.warn('PWA Service Worker registration error:', err);
          });
        });
      }
    </script>
